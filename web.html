<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluency Trainer</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #5f2c82, #49a09d);
  color: white;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: 50px auto;
}

.chat-box {
  background: #eee;
  color: black;
  padding: 20px;
  border-radius: 15px;
  height: 300px;
  overflow-y: auto;
  text-align: left;
}

.input-box {
  margin-top: 20px;
}

textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  background: #6a11cb;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>Fluency Trainer</h1>

  <div id="chat" class="chat-box"></div>

  <div class="input-box">
    <textarea id="input" rows="3" placeholder="Введите сообщение..."></textarea>
    <button onclick="send()">Отправить</button>
  </div>
</div>

<script>
async function send() {
  const inputField = document.getElementById("input");
  const chat = document.getElementById("chat");
  const input = inputField.value.trim();

  if (!input) return;

  // Show user message
  chat.innerHTML += "<p><b>Вы:</b> " + input + "</p>";
  inputField.value = "";

  try {
    const res = await fetch("https://hook.eu1.make.com/fl9pxf9xzao8grt87llyo6pdlio89wqf", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: input
      })
    });

    const text = await res.text();

    console.log("RAW RESPONSE:", text);

    let reply;

    try {
      const data = JSON.parse(text);
      reply = data.reply || text;
    } catch {
      reply = text;
    }

    chat.innerHTML += "<p><b>Бот:</b> " + reply + "</p>";

  } catch (error) {
    chat.innerHTML += "<p style='color:red'><b>Ошибка подключения</b></p>";
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
