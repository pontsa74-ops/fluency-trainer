<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fluency Trainer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a5acd, #20b2aa);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
        }

        .container {
            width: 600px;
            max-width: 90%;
        }

        #chatBox {
            background: white;
            border-radius: 15px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 70px;
            border-radius: 10px;
            border: none;
            padding: 10px;
            resize: none;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #6a5acd;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #5a4bbd;
        }
    </style>
</head>

<body>

<h1>Fluency Trainer</h1>

<div class="container">

    <div id="chatBox"></div>

    <textarea id="userInput" placeholder="Введите сообщение..."></textarea>

    <button onclick="sendMessage()">Отправить</button>

</div>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    const chatBox = document.getElementById("chatBox");

    if (!text) return;

    // Show user message
    chatBox.innerHTML += `<div><b>Вы:</b> ${text}</div>`;

    try {
        const response = await fetch("https://cors-anywhere.herokuapp.com/https://hook.eu1.make.com/fl9pxf9xzao8grt87llyo6pdlio89wqf", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: text
            })
        });

        const data = await response.json();

        chatBox.innerHTML += `<div><b>Бот:</b> ${data.reply}</div>`;

    } catch (error) {
        chatBox.innerHTML += `<div style="color:red;">Ошибка подключения</div>`;
    }

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
